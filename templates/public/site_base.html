{% extends 'base.html' %}

{% block title %}{{ site.display_name }}{% endblock %}
{% block extra_css %}
<style>
    :root {
        --site-primary: {{ site.theme.primary_color }};
        --site-secondary: {{ site.theme.secondary_color }};
    }
    .site-theme a { color: var(--site-primary); }
    .site-theme .btn-primary { background-color: var(--site-primary); border-color: var(--site-primary); color: #fff; }
    .site-theme .site-accent { color: var(--site-primary); }
    .site-theme .site-muted { color: var(--site-secondary); }
    {% if site.template_key == 'classic' %}
    .site-theme h1, .site-theme h2 { letter-spacing: -.025em; }
    .site-theme .card { border-radius: .35rem; }
    {% elif site.template_key == 'social' %}
    .site-theme .card { border: 0; border-radius: 1.25rem; box-shadow: 0 .5rem 1.5rem rgba(0,0,0,.08); }
    .site-theme h1, .site-theme h2 { font-weight: 700; }
    {% endif %}
    {% if site.theme.typography_key == 'serif' %}.site-theme { font-family: Georgia, 'Times New Roman', serif; }{% endif %}
    {% if site.theme.typography_key == 'rounded' %}.site-theme { font-family: 'Trebuchet MS', system-ui, sans-serif; }{% endif %}
</style>
{% endblock %}

{% block navbar %}{% include "partials/navbar.html" with navbar_site=site %}{% endblock %}
{% block footer %}{% include "partials/footer.html" with footer_site=site %}{% endblock %}
