{% extends 'base.html' %}
{% block title %}Respond to review{% endblock %}
{% block content %}<div class="mx-auto" style="max-width: 42rem"><a href="{% url 'reviews:manage' site.id %}">&larr; Reviews</a><h1>Respond to {{ review.display_name }}</h1><blockquote class="border-start border-3 ps-3">{{ review.comment|linebreaksbr }}</blockquote><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Publish response</button></form></div>{% endblock %}
