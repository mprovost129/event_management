{% if page_obj.paginator.num_pages > 1 %}
<nav class="mt-4" aria-label="Pagination">
    <ul class="pagination justify-content-center flex-wrap">
        <li class="page-item{% if not page_obj.has_previous %} disabled{% endif %}">
            {% if page_obj.has_previous %}<a class="page-link" href="{% querystring page=page_obj.previous_page_number %}" rel="prev">Previous</a>{% else %}<span class="page-link">Previous</span>{% endif %}
        </li>
        <li class="page-item disabled"><span class="page-link">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span></li>
        <li class="page-item{% if not page_obj.has_next %} disabled{% endif %}">
            {% if page_obj.has_next %}<a class="page-link" href="{% querystring page=page_obj.next_page_number %}" rel="next">Next</a>{% else %}<span class="page-link">Next</span>{% endif %}
        </li>
    </ul>
</nav>
{% endif %}
