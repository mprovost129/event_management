{% extends 'base.html' %}

{% block title %}Password reset complete | {{ platform_name }}{% endblock %}

{% block content %}
<div class="gh-auth-centered"><div class="gh-auth-card text-center">
    <span class="gh-confirmation-mark" aria-hidden="true">✓</span>
    <h1>Your password is ready</h1>
    <p class="text-secondary">Sign in with your new password to return to Gather HQs.</p>
    <a class="btn btn-primary" href="{% url 'users:login' %}">Sign in now</a>
</div></div>
{% endblock %}
