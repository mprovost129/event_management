{% extends 'base.html' %}

{% block title %}Password changed | {{ platform_name }}{% endblock %}

{% block content %}
<div class="gh-auth-centered"><div class="gh-auth-card text-center">
    <span class="gh-confirmation-mark" aria-hidden="true">✓</span>
    <h1>Your password has been changed</h1>
    <p class="text-secondary">You're still signed in with your new password.</p>
    <a class="btn btn-primary" href="{% url 'users:profile' %}">Back to profile</a>
</div></div>
{% endblock %}
