{% extends 'base.html' %}

{% block title %}Change password | {{ platform_name }}{% endblock %}

{% block content %}
<div class="gh-auth-centered"><div class="gh-auth-card">
    <p class="gh-step-label">Account security</p>
    <h1>Change your password</h1>
    <form method="post" novalidate>{% csrf_token %}{% include 'includes/form_fields.html' %}<button class="btn btn-primary btn-lg w-100" type="submit">Save new password</button></form>
    <div class="gh-auth-footer">
        <a href="{% url 'users:profile' %}">Back to profile</a>
    </div>
</div></div>
{% endblock %}
