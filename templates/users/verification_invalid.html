{% extends 'base.html' %}

{% block title %}Invalid verification link | {{ platform_name }}{% endblock %}
{% block content %}
<div class="gh-auth-centered">
    <div class="gh-auth-card text-center">
        <span class="gh-confirmation-mark gh-confirmation-mark-warning" aria-hidden="true">!</span>
        <h1>This link has expired</h1>
        <p class="text-secondary">Verification links can only be used once and expire for your security.</p>
        <a class="btn btn-primary" href="{% url 'users:resend_verification' %}">Request a new link</a>
    </div>
</div>
{% endblock %}
