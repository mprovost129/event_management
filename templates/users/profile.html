{% extends 'base.html' %}

{% block title %}Profile | {{ platform_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-xl-8">
        <section class="card shadow-sm">
            <div class="card-body p-4 p-lg-5">
                <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
                    <div>
                        <p class="text-uppercase small fw-semibold text-secondary mb-1">Your profile</p>
                        <h1 class="h3 mb-1">Account details</h1>
                        <p class="text-secondary mb-0">Manage your public name, avatar, and mailing information.</p>
                    </div>
                    <a class="btn btn-outline-secondary" href="{% url 'sites:account_dashboard' %}">Back to account</a>
                </div>

                <form method="post" enctype="multipart/form-data" novalidate>
                    {% csrf_token %}
                    {% include 'includes/form_fields.html' %}
                    <div class="d-flex flex-wrap gap-2 mt-4">
                        <button class="btn btn-primary" type="submit">Save profile</button>
                        <a class="btn btn-outline-secondary" href="{% url 'sites:account_dashboard' %}">Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
{% endblock %}
