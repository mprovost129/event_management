{% extends 'base.html' %}
{% block title %}Edit photo | {{ album.title }}{% endblock %}
{% block content %}<div class="gh-content-editor">
<div class="gh-editor-head">
    <div><a class="gh-back-link" href="{% url 'events:album_edit' site.id album.id %}">&larr; {{ album.title }}</a><p class="gh-step-label mt-3">Photo details</p>
        <h1>Describe this moment.</h1>
        <p>A useful description makes the album accessible and searchable.</p>
    </div>
</div>
<div class="gh-album-editor-grid">
    <section><img class="gh-public-event-image" src="{{ photo.image.url }}" alt="{{ photo.alt_text }}"></section>
    <section class="gh-editor-card">
        <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Save photo details</button><a class="btn btn-link" href="{% url 'events:album_edit' site.id album.id %}">Cancel</a></form>
    </section>
</div>
</div>{% endblock %}
