name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gatherhqs_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gatherhqs_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_ENGINE: postgres
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gatherhqs_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ci-only-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Django system checks
        run: python manage.py check
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Ruff lint
        run: ruff check .
      - name: Ruff formatting
        run: ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Dependency audit
        run: pip-audit
      - name: Production deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          PLATFORM_DOMAIN: gatherhqs.com
          PLATFORM_CONTROL_HOSTS: gatherhqs.com,www.gatherhqs.com
          ALLOWED_HOSTS: gatherhqs.com,www.gatherhqs.com
          CSRF_TRUSTED_ORIGINS: https://gatherhqs.com
          RELEASE_VERSION: ci
          HEALTHCHECK_REQUIRE_BACKGROUND_WORKERS: "true"
          MEDIA_STORAGE_BACKEND: s3
          AWS_STORAGE_BUCKET_NAME: ci-placeholder
          AWS_S3_ENDPOINT_URL: ""
          AWS_S3_SIGNATURE_VERSION: s3v4
          DOCUMENT_UPLOAD_SCAN_BACKEND: cloudmersive
          CLOUDMERSIVE_API_KEY: ci-placeholder
          EMAIL_DELIVERY_BACKEND: resend
          EMAIL_BACKEND: communications.email_backend.ResendEmailBackend
          RESEND_API_KEY: ci-placeholder
          RESEND_WEBHOOK_SECRET: ci-placeholder
          SUPPORT_EMAIL: support@gatherhqs.com
          SECRET_KEY: ci-only-deploy-check-placeholder-key-not-used-in-production
          # Real Stripe price IDs are secrets and deliberately absent here;
          # their absence only raises platform.W002, a warning, not an error.
          STRIPE_STANDARD_MONTHLY_PRICE_ID: ""
          STRIPE_STANDARD_YEARLY_PRICE_ID: ""
        run: python manage.py check --deploy --settings=config.settings.prod

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t gatherhqs-ci-build .
