[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.Settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
testpaths = ["attendance", "communications", "content", "contacts", "core", "events", "ops", "payments", "reviews", "sites", "subscriptions", "users"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["attendance", "communications", "config", "contacts", "content", "core", "events", "ops", "payments", "sites", "subscriptions", "users"]
